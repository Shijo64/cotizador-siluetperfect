<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotización — Siluet Perfect</title>
<script src="libs/jspdf.umd.min.js"></script>
<script src="libs/jspdf.plugin.autotable.min.js"></script>
<style>
  :root {
    --primary: #066c6e;
    --primary-dark: #04545a;
    --primary-soft: #e6f7f7;
    --secondary: #3cc1c5;
    --bg: #f2faf9;
    --card: #ffffff;
    --border: #d8ecea;
    --text: #12201f;
    --muted: #5d7a78;
    --accent: #f6fbfb;
    --danger: #b3273a;
    --shadow: 0 1px 2px rgba(6,108,110,.06), 0 18px 40px -24px rgba(6,108,110,.35);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    background: radial-gradient(1100px 520px at 50% -260px, #ffffff 0%, var(--bg) 62%) no-repeat, var(--bg);
    color: var(--text); line-height: 1.55; padding: 40px 20px 56px;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 1040px; margin: 0 auto; background: var(--card);
    border: 1px solid var(--border); border-radius: 22px; padding: 40px;
    box-shadow: var(--shadow);
  }

  /* ---- Cabecera ---- */
  header { display: flex; gap: 22px; align-items: center; padding-bottom: 28px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
  .logo {
    width: 84px; height: 84px; flex-shrink: 0; border-radius: 18px; overflow: hidden;
    background: var(--primary-soft); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--primary); font-weight: 800; font-size: .8rem; letter-spacing: .08em;
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }
  .company { min-width: 0; }
  .company h1 { font-size: clamp(1.35rem, 2.6vw, 1.75rem); font-weight: 800; letter-spacing: -.02em; color: var(--primary-dark); line-height: 1.2; }
  .company p { color: var(--muted); font-size: .82rem; line-height: 1.5; margin-top: 3px; }
  .doc-badge {
    margin-left: auto; align-self: flex-start; text-align: right;
    font-size: .68rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
    color: var(--primary); background: var(--primary-soft); border: 1px solid var(--border);
    padding: 7px 12px; border-radius: 999px; white-space: nowrap;
  }

  /* ---- Datos de la cotización ---- */
  .meta {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 18px; padding: 20px; margin-bottom: 24px;
    background: var(--accent); border: 1px solid var(--border); border-radius: var(--radius);
  }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field label {
    font-size: .68rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  }
  input[type="number"], input[type="text"], input[type="date"], select {
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
    font-size: .9rem; font-family: inherit; color: var(--text); background: var(--card);
    transition: border-color .15s, box-shadow .15s; width: 100%;
  }
  input[type="number"] { width: 74px; text-align: right; }
  input[type="date"] { max-width: 190px; }
  input::placeholder { color: #8fa8a6; opacity: 1; }
  input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(60,193,197,.18); }
  #quoteNumber { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--primary-dark); background: var(--primary-soft); border-color: transparent; cursor: default; }

  /* ---- Botones ---- */
  .toolbar { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .btn {
    font: inherit; font-size: .82rem; font-weight: 700; letter-spacing: .01em;
    padding: 10px 18px; border-radius: 999px; border: 1px solid transparent;
    background: var(--accent); color: var(--primary-dark); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .15s, color .15s, border-color .15s, transform .1s, box-shadow .15s;
  }
  .btn:hover { background: #eef5f5; border-color: var(--border); }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 8px 18px -10px rgba(6,108,110,.75); }
  .btn-primary:hover { background: var(--primary-dark); border-color: transparent; }
  .btn-ghost { background: transparent; border-color: var(--border); color: var(--muted); }
  .btn-ghost:hover { background: var(--accent); color: var(--primary-dark); }
  .btn-danger { background: transparent; border-color: transparent; color: var(--muted); padding: 7px 11px; font-size: .76rem; font-weight: 600; }
  .btn-danger:hover { background: #fdeef0; border-color: #f6d9de; color: var(--danger); }
  .btn-lg { padding: 14px 40px; font-size: .92rem; }
  .actions { display: flex; justify-content: flex-end; margin-top: 26px; }

  /* ---- Tabla ---- */
  .table-responsive {
    border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; -webkit-overflow-scrolling: touch;
    max-height: 62vh; background: var(--card);
  }
  table { width: 100%; border-collapse: separate; border-spacing: 0; }
  th, td { padding: 13px 14px; text-align: left; vertical-align: middle; }
  th {
    position: sticky; top: 0; z-index: 1;
    background: var(--primary-soft); color: var(--primary-dark);
    font-size: .68rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
    white-space: nowrap; border-bottom: 1px solid var(--border);
  }
  td { border-bottom: 1px solid #edf6f5; font-size: .9rem; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #fbfefe; }
  .product-img { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: var(--accent); display: block; }
  .product-name { font-weight: 600; min-width: 150px; }
  .price, .line-total { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .price { color: var(--muted); }
  .line-total { font-weight: 700; }
  tbody:empty::after { content: ""; }
  .empty-row td { color: var(--muted); font-size: .87rem; padding: 28px 14px; text-align: center; background: var(--accent); }

  /* ---- Totales ---- */
  .summary {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 28px;
    margin-top: 20px; padding: 20px 22px; flex-wrap: wrap;
    background: var(--accent); border: 1px solid var(--border); border-radius: var(--radius);
  }
  .iva-toggle {
    display: inline-flex; align-items: center; gap: 9px; cursor: pointer;
    font-size: .78rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    color: var(--primary-dark); padding: 9px 14px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--border);
  }
  .iva-toggle input { width: 17px; height: 17px; accent-color: var(--primary); cursor: pointer; }
  .summary-rows { margin-left: auto; min-width: 300px; display: flex; flex-direction: column; gap: 8px; }
  .sum-row { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; font-size: .86rem; color: var(--muted); }
  .sum-row span:last-child { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--text); }
  .sum-row.total { margin-top: 4px; padding-top: 12px; border-top: 1px solid var(--border); font-size: .74rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--primary-dark); }
  .sum-row.total span:last-child { font-size: 1.55rem; font-weight: 800; letter-spacing: -.02em; color: var(--primary); }

  .lookup-status { font-size: .8rem; color: var(--muted); }
  .lookup-status.success { color: #1f8a4c; }
  .lookup-status.error { color: var(--danger); }
  .lookup-status.loading { color: #b57d09; }

  @media print {
    body { background: none; padding: 0; }
    .toolbar, .btn, .actions, #undoToast { display: none !important; }
    .container { box-shadow: none; border: none; padding: 0; border-radius: 0; }
    .table-responsive { max-height: none; overflow: visible; }
  }

  @media (max-width: 640px) {
    body { padding: 10px 8px 30px; }
    .container { padding: 14px 12px; border-radius: 12px; }
    header { gap: 10px; padding-bottom: 14px; margin-bottom: 14px; }
    .logo { width: 56px; height: 56px; border-radius: 12px; }
    .company h1 { font-size: 1.25rem; }
    .company p { font-size: .72rem; }
    .doc-badge { display: none; }
    /* tabla -> tarjetas apiladas en móvil */
    #productsTable thead { display: none; }
    #productsTable, #productsTable tbody { display: block; }
    #productsTable tr { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; padding: 12px 14px; border-bottom: 1px solid #edf6f5; position: relative; align-items: center; }
    #productsTable tbody tr:last-child { border-bottom: none; }
    #productsTable td { display: block; padding: 0; border: none; white-space: normal; }
    #productsTable td:first-child { display: none; }
    #productsTable td:nth-child(2) { grid-column: 1 / -1; font-weight: 700; font-size: .95rem; padding-right: 54px; }
    #productsTable td:nth-child(3)::before { content: "Precio"; }
    #productsTable td:nth-child(4)::before { content: "Cant."; }
    #productsTable td:nth-child(5)::before { content: "Desc. %"; }
    #productsTable td:nth-child(6)::before { content: "Importe"; }
    #productsTable td:nth-child(3), #productsTable td:nth-child(4),
    #productsTable td:nth-child(5), #productsTable td:nth-child(6) { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: .82rem; }
    #productsTable td:nth-child(3)::before, #productsTable td:nth-child(4)::before,
    #productsTable td:nth-child(5)::before, #productsTable td:nth-child(6)::before { color: var(--muted); font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
    #productsTable td:nth-child(6) { font-size: .95rem; }
    #productsTable td:nth-child(7) { position: absolute; top: 8px; right: 8px; }
    #productsTable td:nth-child(7) .btn { padding: 5px 8px; font-size: .7rem; }
    input[type="number"] { width: 62px; padding: 7px 8px; }
    .table-responsive { max-height: none; }
    .meta { padding: 10px; gap: 8px; margin-bottom: 14px; }
    .toolbar { margin-bottom: 10px; }
    .table-responsive { max-height: 50vh; border-radius: 10px; }
    th, td { padding: 8px 8px; font-size: .8rem; }
    .product-img { width: 36px; height: 36px; border-radius: 8px; }
    .summary { padding: 12px; gap: 10px; margin-top: 14px; }
    .container { padding-bottom: 24px; }
    .actions { position: sticky; bottom: 0; margin: 16px -12px -24px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.94); backdrop-filter: blur(8px); border-top: 1px solid var(--border); }
    .actions .btn { width: 100%; }
  }


/* Historial: apilar filas en móvil */
@media (max-width: 560px) {
  #histModal thead { display: none; }
  #histModal tbody tr {
    display: grid; grid-template-columns: 1fr auto; gap: 2px 10px;
    padding: 10px 0; border-bottom: 1px solid #eee;
  }
  #histModal tbody td { display: block; border: 0 !important; padding: 0 !important; }
  #histModal .h-fecha { text-align: right; color: #6b7f7f; font-size: .78rem; }
  #histModal .h-total { text-align: right; }
  #histModal .h-acc { grid-column: 1 / 3; display: flex; gap: 8px; padding-top: 8px !important; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo" id="logoContainer"><span>LOGO</span></div>
    <div class="company">
      <h1 id="companyName">Siluet Perfect</h1>
      <p id="companyRFC">RFC: REHA6212318T1</p>
      <p id="companyAddress">Monterrey, N.L., México</p>
      <p id="companyContact">Tel: 8112400513 | Cel: 8116876950 | adrianamarissa@hotmail.com</p>
    </div>
    <span class="doc-badge">Cotización</span>
  </header>

  <div class="meta">
    <div class="field">
      <label for="quoteDate">Fecha</label>
      <input type="date" id="quoteDate" onchange="updateQuoteDate(this.value)">
    </div>
    <div class="field">
      <label for="clientName">Cliente</label>
      <input type="text" id="clientName" value="" placeholder="Nombre del cliente" onchange="updateClientName(this.value)">
    </div>
    <div class="field">
      <label for="clientPhone">Teléfono / WhatsApp</label>
      <input type="text" id="clientPhone" value="" placeholder="Opcional" onchange="updateClientPhone(this.value)">
    </div>
    <div class="field">
      <label for="clientRfc">RFC / Dirección</label>
      <input type="text" id="clientRfc" value="" placeholder="Opcional" onchange="updateClientRfc(this.value)">
    </div>
    <div class="field">
      <label for="quoteValidity">Vigencia</label>
      <select id="quoteValidity" onchange="updateValidity(this.value)">
        <option value="7 días">7 días</option>
        <option value="15 días" selected>15 días</option>
        <option value="30 días">30 días</option>
      </select>
    </div>
    <div class="field">
      <label for="quoteNumber">Folio</label>
      <input type="text" id="quoteNumber" readonly>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn btn-primary" id="addProductBtn" title="Agregar producto">+ Agregar producto</button>
    <button class="btn btn-ghost" onclick="newQuote()" title="Empezar cotización en blanco">Nueva cotización</button>
    <button class="btn btn-ghost" onclick="openHistoryModal()" title="Ver historial de cotizaciones">Historial</button>
  </div>

  <div class="table-responsive">
    <table id="productsTable">
      <thead>
        <tr>
          <th style="width: 64px;">Foto</th>
          <th>Producto</th>
          <th style="width: 110px;">Precio Unit.</th>
          <th style="width: 74px;">Cant.</th>
          <th style="width: 96px;">Desc. %</th>
          <th style="width: 110px;">Importe</th>
          <th style="width: 76px;"></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="summary">
    <label class="iva-toggle" for="ivaToggle">
      <input type="checkbox" id="ivaToggle" onchange="toggleIVA(this.checked)"> IVA 16%
    </label>
    <div class="summary-rows">
      <div class="sum-row"><span>Descuento</span><span id="discountTotal">$0.00</span></div>
      <div class="sum-row" id="ivaBox" style="display: none;"><span>IVA 16%</span><span id="ivaTotal">$0.00</span></div>
      <div class="sum-row total"><span>Total</span><span id="finalTotal">$0.00</span></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-success btn-lg" onclick="shareWhatsApp()" style="background: #25d366; color: white; border: none;" title="Compartir cotización por WhatsApp">💬 Compartir WhatsApp</button>
    <button class="btn btn-primary btn-lg" onclick="exportToPDF()">Guardar</button>
  </div>
</div>

// ===== PERSISTENCIA LOCAL =====
const QUOTE_KEY = 'siluet_current_quote';
const FOLIO_KEY = 'siluet_folio_seq';

function saveQuote() {
  const payload = {
    quote: quoteData.quote,
    products: quoteData.products,
    iva: document.getElementById('ivaToggle').checked,
    v: 2
  };
  localStorage.setItem(QUOTE_KEY, JSON.stringify(payload));
  // Guardar también en historial (máx 20)
  const HIST_KEY = 'siluet_quote_history';
  let history = JSON.parse(localStorage.getItem(HIST_KEY) || '[]');
  const idx = history.findIndex(item => item.quote.number === quoteData.quote.number);
  if (idx >= 0) {
    history[idx] = payload;
  } else {
    history.unshift(payload);
  }
  if (history.length > 20) history = history.slice(0, 20);
  localStorage.setItem(HIST_KEY, JSON.stringify(history));
}

function nextFolio() {
  const n = (parseInt(localStorage.getItem(FOLIO_KEY) || '0', 10) || 0) + 1;
  localStorage.setItem(FOLIO_KEY, String(n));
  return 'SP-' + String(n).padStart(4, '0');
}

// Set current date on load; restaurar cotización guardada si existe
document.addEventListener('DOMContentLoaded', () => {
  const today = new Date().toISOString().split('T')[0];
  const saved = JSON.parse(localStorage.getItem(QUOTE_KEY) || 'null');
  if (saved && saved.v === 2 && saved.products) {
    Object.assign(quoteData.quote, saved.quote);
    quoteData.products = saved.products;
    if (saved.iva) document.getElementById('ivaToggle').checked = true;
    document.getElementById('quoteValidity').value = quoteData.quote.validity || '15 días';
  } else {
    quoteData.quote.number = nextFolio();
  }
  quoteData.quote.date = today;
  if (!/^SP-\d{4}$/.test(quoteData.quote.number)) quoteData.quote.number = nextFolio();
  document.getElementById('quoteDate').value = quoteData.quote.date;
  document.getElementById('clientName').value = quoteData.quote.client || '';
  document.getElementById('clientPhone').value = quoteData.quote.phone || '';
  document.getElementById('clientRfc').value = quoteData.quote.rfc || '';
  document.getElementById('quoteNumber').value = quoteData.quote.number;
  toggleIVA(document.getElementById('ivaToggle').checked);
  renderProducts();
  recalc();
  initProductDatabase();
});

function initProductDatabase() {
  // Sincronizar catálogo con productos descargados
  localStorage.setItem(PRODUCT_DB_KEY, JSON.stringify(initialProductCatalog));
  console.log('Catálogo sincronizado:', initialProductCatalog.length, 'productos.');
}

function getProductFromDB(name) {
  const catalog = JSON.parse(localStorage.getItem(PRODUCT_DB_KEY) || '[]');
  const normalizedName = name.toLowerCase().trim();
  return catalog.find(p => p.name.toLowerCase().trim() === normalizedName) || null;
}

function searchProducts(query) {
  const catalog = JSON.parse(localStorage.getItem(PRODUCT_DB_KEY) || '[]');
  const q = query.toLowerCase().trim();
  return catalog.filter(p => p.name.toLowerCase().includes(q));
}

// ===== RENDER =====
function renderCompany() {
  document.getElementById('companyName').textContent = quoteData.company.name;
  document.getElementById('companyRFC').textContent = `RFC: ${quoteData.company.rfc}`;
  document.getElementById('companyAddress').textContent = quoteData.company.address;
  document.getElementById('companyContact').textContent = quoteData.company.contact;
  const logoContainer = document.getElementById('logoContainer');
  if (quoteData.company.logo) {
    logoContainer.innerHTML = `<img src="${quoteData.company.logo}" alt="Logo ${quoteData.company.name}">`;
  }
}
function renderMeta() {
  document.getElementById('quoteDate').textContent = quoteData.quote.date;
  document.getElementById('clientName').textContent = quoteData.quote.client;
}
function renderProducts() {
  const tbody = document.querySelector('#productsTable tbody');
  tbody.innerHTML = quoteData.products.map((p, i) => `
    <tr data-index="${i}">
      <td><img class="product-img" src="${p.img || 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 60 60%22><rect fill=%22%23f1f7f7%22 width=%2260%22 height=%2260%22/><circle cx=%2230%22 cy=%2224%22 r=%228%22 fill=%22%23bcd8d7%22/><path d=%22M12 52c0-9 8-15 18-15s18 6 18 15z%22 fill=%22%23bcd8d7%22/></svg>'}" alt="${p.name}"></td>
      <td class="product-name" contenteditable="true" data-field="name" data-index="${i}" onblur="editProductField(${i}, 'name', this.textContent)">${p.name}</td>
      <td class="price contenteditable" contenteditable="true" data-field="price" data-index="${i}" onblur="editProductField(${i}, 'price', parseNum(this.textContent))">${fmt(p.price)}</td>
      <td><input type="number" class="qty-input" value="${p.qty || 1}" min="1" step="1" data-index="${i}" aria-label="Cantidad para ${p.name}"></td>
      <td><input type="number" class="discount-input" value="${p.discount}" min="0" max="100" step="0.1" data-index="${i}" aria-label="Descuento para ${p.name}"></td>
      <td class="price line-total" data-index="${i}">${fmt(p.price * (p.qty || 1) * (1 - p.discount / 100))}</td>
      <td><button class="btn btn-danger btn-sm" onclick="removeProduct(${i})" title="Quitar producto">Quitar</button></td>
    </tr>
  `).join('') || `<tr class="empty-row"><td colspan="7">Aún no hay productos. Usa «+ Agregar producto» para empezar.</td></tr>`;
  attachDiscountListeners();
}
function attachDiscountListeners() {
  document.querySelectorAll('.discount-input').forEach(input => {
    input.addEventListener('input', (e) => {
      const idx = parseInt(e.target.dataset.index);
      const val = Math.max(0, Math.min(100, parseNum(e.target.value)));
      e.target.value = val;
      quoteData.products[idx].discount = val;
      recalc();
    });
    input.addEventListener('blur', (e) => {
      if (e.target.value === '') e.target.value = 0;
    });
  });
  document.querySelectorAll('.qty-input').forEach(input => {
    input.addEventListener('input', (e) => {
      const idx = parseInt(e.target.dataset.index);
      const val = Math.max(1, Math.round(parseNum(e.target.value)) || 1);
      quoteData.products[idx].qty = val;
      recalc();
    });
    input.addEventListener('blur', (e) => {
      if (e.target.value === '') { e.target.value = 1; quoteData.products[parseInt(e.target.dataset.index)].qty = 1; recalc(); }
    });
  });
}
// delegar clics en celdas editables para re-render precio al editar
document.querySelector('#productsTable tbody').addEventListener('blur', (e) => {
  if (e.target.matches('[data-field="price"]')) {
    const idx = parseInt(e.target.dataset.index);
    const val = parseNum(e.target.textContent);
    quoteData.products[idx].price = val;
    recalc();
  }
}, true);

function recalc() {
  let subtotal = 0;
  let totalDiscount = 0;
  quoteData.products.forEach((p, i) => {
    const qty = p.qty || 1;
    const lineTotal = p.price * qty * (1 - p.discount / 100);
    const lineDiscount = p.price * qty - lineTotal;
    subtotal += lineTotal;
    totalDiscount += lineDiscount;
    const el = document.querySelector(`.line-total[data-index="${i}"]`);
    if (el) el.textContent = fmt(lineTotal);
  });
  const ivaOn = document.getElementById('ivaToggle').checked;
  const iva = ivaOn ? subtotal * 0.16 : 0;
  document.getElementById('ivaTotal').textContent = fmt(iva);
  document.getElementById('discountTotal').textContent = fmt(totalDiscount);
  document.getElementById('finalTotal').textContent = fmt(subtotal + iva);
  saveQuote();
}

// ===== IVA =====
function toggleIVA(on) {
  document.getElementById('ivaBox').style.display = on ? '' : 'none';
  recalc();
}

// ===== NUEVA COTIZACIÓN =====
function newQuote() {
  if (quoteData.products.length && !confirm('¿Iniciar una cotización nueva? Se borrará la actual.')) return;
  quoteData.products = [];
  quoteData.quote.client = '';
  quoteData.quote.phone = '';
  quoteData.quote.rfc = '';
  quoteData.quote.date = new Date().toISOString().split('T')[0];
  quoteData.quote.number = nextFolio();
  quoteData.quote.validity = '15 días';
  document.getElementById('quoteValidity').value = '15 días';
  document.getElementById('clientName').value = '';
  document.getElementById('clientPhone').value = '';
  document.getElementById('clientRfc').value = '';
  document.getElementById('quoteDate').value = quoteData.quote.date;
  document.getElementById('quoteNumber').value = quoteData.quote.number;
  renderProducts();
  recalc();
}

// ===== EDITAR CAMPO =====
function editProductField(idx, field, value) {
  if (field === 'price') value = parseNum(value);
  quoteData.products[idx][field] = value;
  recalc();
}

// ===== AGREGAR PRODUCTO (con búsqueda en base de datos local) =====
document.getElementById('addProductBtn').addEventListener('click', () => {
  showProductSelector();
});

function showProductSelector() {
  const catalog = JSON.parse(localStorage.getItem(PRODUCT_DB_KEY) || '[]');

  // Crear modal
  const modal = document.createElement('div');
  modal.style.cssText = `
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
    z-index: 1000; font-family: system-ui, -apple-system, sans-serif;
  `;

  const content = document.createElement('div');
  content.style.cssText = `
    background: white; border-radius: 12px; padding: 24px; width: 90%; max-width: 600px; max-height: 80vh;
    overflow: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  `;

  content.innerHTML = `
    <h3 style="margin: 0 0 16px; color: var(--primary);">Agregar producto</h3>
    <input type="text" id="productSearch" placeholder="Buscar producto..."
           style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; margin-bottom: 12px;">
    <select id="categoryFilter" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; margin-bottom: 16px;">
      <option value="">Todas las categorías</option>
    </select>
    <div id="productList" style="max-height: 400px; overflow: auto;"></div>
    <div style="margin-top: 16px; display: flex; justify-content: flex-end; gap: 8px;">
      <button class="btn" id="cancelAdd">Cancelar</button>
      <button class="btn btn-primary" id="addCustomProduct" style="display: none;">Agregar manualmente</button>
    </div>
  `;

  modal.appendChild(content);
  document.body.appendChild(modal);

  const searchInput = content.querySelector('#productSearch');
  const productList = content.querySelector('#productList');
  const categorySelect = content.querySelector('#categoryFilter');
  const addCustomBtn = content.querySelector('#addCustomProduct');

  const categories = [...new Set(catalog.map(p => p.category))].filter(Boolean).sort();
  categorySelect.innerHTML = '<option value="">Todas las categorías</option>' +
    categories.map(c => `<option value="${c}">${c}</option>`).join('');

  function renderList(filter = '', category = '') {
    const filtered = catalog.filter(p =>
      (!filter || p.name.toLowerCase().includes(filter.toLowerCase())) &&
      (!category || p.category === category)
    );

    productList.innerHTML = filtered.map(p => `
      <div class="product-option" data-name="${p.name}" data-price="${p.price}" data-url="${p.url}" data-img="${p.img || ''}"
           style="padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 12px;">
        <img src="${p.img || 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 60 60%22><rect fill=%22%23f1f7f7%22 width=%2260%22 height=%2260%22/><circle cx=%2230%22 cy=%2224%22 r=%228%22 fill=%22%23bcd8d7%22/><path d=%22M12 52c0-9 8-15 18-15s18 6 18 15z%22 fill=%22%23bcd8d7%22/></svg>'}"
             alt="${p.name}" style="width: 50px; height: 50px; border-radius: 4px; object-fit: cover; background: #f0f0f0;">
        <div style="flex: 1; min-width: 0;">
          <div style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${p.name}</div>
          <div style="font-size: 0.85rem; color: var(--muted);">${p.category} • ${fmt(p.price)}</div>
        </div>
      </div>
    `).join('') + (filter && filtered.length === 0 ?
      '<div style="padding: 16px; text-align: center; color: var(--muted);">No se encontraron productos</div>' : '');

    // Mostrar botón de agregar manualmente si hay filtro
    addCustomBtn.style.display = filter || category ? 'inline-flex' : 'none';

    // Event listeners para opciones
    productList.querySelectorAll('.product-option').forEach(opt => {
      opt.addEventListener('click', () => {
        const name = opt.dataset.name;
        const price = parseFloat(opt.dataset.price);
        const img = opt.dataset.img || '';
        addProductToQuote(name, price, img);
        document.body.removeChild(modal);
      });
      opt.addEventListener('mouseenter', () => opt.style.background = '#f5f5f5');
      opt.addEventListener('mouseleave', () => opt.style.background = 'transparent');
    });
  }

  searchInput.addEventListener('input', (e) => renderList(e.target.value, categorySelect.value));
  categorySelect.addEventListener('change', () => renderList(searchInput.value, categorySelect.value));
  searchInput.focus();

  content.querySelector('#cancelAdd').addEventListener('click', () => document.body.removeChild(modal));

  addCustomBtn.addEventListener('click', () => {
    const name = searchInput.value.trim();
    if (!name) return;
    const price = prompt(`Ingresa precio para "${name}":`);
    if (price !== null) {
      addProductToQuote(name, parseNum(price));
      document.body.removeChild(modal);
    }
  });

  // Cerrar con Escape
  modal.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') document.body.removeChild(modal);
  });
  modal.addEventListener('click', (e) => {
    if (e.target === modal) document.body.removeChild(modal);
  });

  renderList();
}

function addProductToQuote(name, price, img = "") {
  quoteData.products.push({ img, name: name.trim(), price, qty: 1, discount: 0 });
  renderProducts();
  recalc();
}

// ===== QUITAR PRODUCTO (con confirmación y deshacer) =====
let lastRemoved = null; // {idx, product, timeoutId}

function removeProduct(idx) {
  const product = quoteData.products[idx];
  if (!product) return;

  // Modal de confirmación
  const modal = document.createElement('div');
  modal.style.cssText = `
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
    z-index: 1000; font-family: system-ui, -apple-system, sans-serif;
  `;
  modal.innerHTML = `
    <div style="background: white; border-radius: 12px; padding: 24px; width: 90%; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);">
      <h3 style="margin: 0 0 12px; color: var(--primary);">¿Quitar producto?</h3>
      <p style="margin: 0 0 20px; color: var(--text);">¿Eliminar "<strong>${product.name}</strong>" de la cotización?</p>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn" id="cancelRemove">Cancelar</button>
        <button class="btn btn-danger" id="confirmRemove">Quitar</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  modal.querySelector('#cancelRemove').addEventListener('click', () => document.body.removeChild(modal));
  modal.querySelector('#confirmRemove').addEventListener('click', () => {
    document.body.removeChild(modal);
    performRemove(idx, product);
  });
  modal.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.body.removeChild(modal); });
  modal.addEventListener('click', (e) => { if (e.target === modal) document.body.removeChild(modal); });
}

function performRemove(idx, product) {
  // Guardar para deshacer
  lastRemoved = { idx, product: {...product} };

  quoteData.products.splice(idx, 1);
  renderProducts();
  recalc();

  // Mostrar toast con deshacer
  showUndoToast();
}

function showUndoToast() {
  // Limpiar toast anterior si existe
  const existing = document.getElementById('undoToast');
  if (existing) existing.remove();

  const toast = document.createElement('div');
  toast.id = 'undoToast';
  toast.style.cssText = `
    position: fixed; bottom: 24px; right: 24px; z-index: 1001;
    background: #066c6e; color: white; padding: 14px 20px; border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 12px;
    animation: slideIn 0.3s ease;
  `;
  toast.innerHTML = `
    <span>Producto eliminado</span>
    <button class="btn" style="background: white; color: #066c6e; padding: 6px 14px; font-size: 0.8rem;" id="undoBtn">Deshacer</button>
  `;

  // Añadir keyframes para animación
  if (!document.getElementById('toastStyles')) {
    const style = document.createElement('style');
    style.id = 'toastStyles';
    style.textContent = `
      @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes slideOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(20px); } }
    `;
    document.head.appendChild(style);
  }

  document.body.appendChild(toast);

  toast.querySelector('#undoBtn').addEventListener('click', undoRemove);

  // Auto-ocultar después de 5 segundos
  lastRemoved.timeoutId = setTimeout(() => {
    hideToast(toast);
    lastRemoved = null;
  }, 5000);
}

function hideToast(toast) {
  toast.style.animation = 'slideOut 0.3s ease forwards';
  setTimeout(() => toast.remove(), 300);
}

function undoRemove() {
  if (!lastRemoved) return;

  clearTimeout(lastRemoved.timeoutId);

  quoteData.products.splice(lastRemoved.idx, 0, lastRemoved.product);
  renderProducts();
  recalc();

  const toast = document.getElementById('undoToast');
  if (toast) hideToast(toast);

  lastRemoved = null;
}

// ===== HISTORIAL DE COTIZACIONES =====
function openHistoryModal() {
  const HIST_KEY = 'siluet_quote_history';
  const history = JSON.parse(localStorage.getItem(HIST_KEY) || '[]');
  
  const prev = document.getElementById('histModal');
  if (prev) prev.remove();
  const modal = document.createElement('div');
  modal.id = 'histModal';
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999;padding:15px;';
  
  let rowsHtml = '';
  if (history.length === 0) {
    rowsHtml = '<tr><td colspan="5" style="text-align:center;padding:20px;color:#666;">No hay cotizaciones guardadas en el historial.</td></tr>';
  } else {
    history.forEach((item, idx) => {
      const total = item.products.reduce((acc, p) => acc + (p.price * p.qty * (1 - (p.discount || 0) / 100)), 0);
      const finalTot = item.iva ? total * 1.16 : total;
      rowsHtml += `
        <tr style="border-bottom:1px solid #eee;">
          <td class="h-folio" style="padding:10px;font-weight:600;color:#066c6e;">${item.quote.number}</td>
          <td class="h-fecha" style="padding:10px;">${(item.quote.date||'').split('-').reverse().join('/')}</td>
          <td class="h-cliente" style="padding:10px;">${item.quote.client || 'Sin cliente'}</td>
          <td class="h-total" style="padding:10px;text-align:right;font-weight:600;">$${finalTot.toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2})}</td>
          <td class="h-acc" style="padding:10px;text-align:center;">
            <button class="btn btn-ghost" style="padding:4px 10px;font-size:0.8rem;" onclick="loadHistoryItem(${idx})">Cargar</button>
            <button class="btn btn-ghost" style="padding:4px 10px;font-size:0.8rem;color:#c0392b;" onclick="deleteHistoryItem(${idx})">Eliminar</button>
          </td>
        </tr>
      `;
    });
  }

  modal.innerHTML = `
    <div style="background:#fff;border-radius:12px;width:100%;max-width:700px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,0.2);overflow:hidden;">
      <div style="padding:16px 20px;background:#066c6e;color:#fff;display:flex;justify-content:space-between;align-items:center;">
        <h3 style="margin:0;font-size:1.1rem;">Historial de Cotizaciones</h3>
        <button id="closeHist" style="background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer;">&times;</button>
      </div>
      <div style="padding:20px;overflow:auto;flex:1;">
        <table style="width:100%;border-collapse:collapse;font-size:0.9rem;">
          <thead>
            <tr style="background:#f4f9f8;color:#066c6e;text-align:left;">
              <th style="padding:10px;">Folio</th>
              <th style="padding:10px;">Fecha</th>
              <th style="padding:10px;">Cliente</th>
              <th style="padding:10px;text-align:right;">Total</th>
              <th style="padding:10px;text-align:center;">Acciones</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml}
          </tbody>
        </table>
      </div>
      <div style="padding:12px 20px;background:#f9f9f9;text-align:right;border-top:1px solid #eee;">
        <button id="closeHistBottom" class="btn btn-ghost" style="padding:6px 16px;">Cerrar</button>
      </div>
    </div>
  `;

  document.body.appendChild(modal);
  modal.querySelector('#closeHist').onclick = () => modal.remove();
  modal.querySelector('#closeHistBottom').onclick = () => modal.remove();
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
}

function loadHistoryItem(idx) {
  const HIST_KEY = 'siluet_quote_history';
  const history = JSON.parse(localStorage.getItem(HIST_KEY) || '[]');
  if (!history[idx]) return;
  const item = history[idx];
  Object.assign(quoteData.quote, item.quote);
  quoteData.products = item.products;
  document.getElementById('ivaToggle').checked = !!item.iva;
  document.getElementById('quoteValidity').value = quoteData.quote.validity || '15 días';
  document.getElementById('clientName').value = quoteData.quote.client || '';
  document.getElementById('clientPhone').value = quoteData.quote.phone || '';
  document.getElementById('clientRfc').value = quoteData.quote.rfc || '';
  document.getElementById('quoteDate').value = quoteData.quote.date || '';
  document.getElementById('quoteNumber').value = quoteData.quote.number || '';
  toggleIVA(!!item.iva);
  renderProducts();
  recalc();
  saveQuote();
  const modal = document.getElementById('histModal');
  if (modal) modal.remove();
}

function deleteHistoryItem(idx) {
  if (!confirm('¿Eliminar esta cotización del historial?')) return;
  const HIST_KEY = 'siluet_quote_history';
  let history = JSON.parse(localStorage.getItem(HIST_KEY) || '[]');
  history.splice(idx, 1);
  localStorage.setItem(HIST_KEY, JSON.stringify(history));
  const modal = document.getElementById('histModal');
  if (modal) modal.remove();
  openHistoryModal();
}


// ===== EXPORTAR A PDF =====

function shareWhatsApp() {
  const client = (quoteData.quote.client || '').trim();
  const phone = (quoteData.quote.phone || '').replace(/\D/g, '');
  const folio = quoteData.quote.number;
  const validity = quoteData.quote.validity || '15';
  
  let subtotal = 0;
  quoteData.items.forEach(i => {
    let price = i.price * (1 - (i.discount || 0) / 100);
    subtotal += price * i.qty;
  });
  let tax = quoteData.quote.includeTax ? subtotal * 0.16 : 0;
  let total = subtotal + tax;
  
  const text = `*COTIZACIÓN SILUET PERFECT*\n*Folio:* #${folio}\n*Cliente:* ${client || 'Mostrador'}\n*Vigencia:* ${validity} días\n*Total:* $${total.toLocaleString('es-MX', {minimumFractionDigits: 2})} MXN\n\nVer detalles en: https://cotizador.siluetperfect.shop`;
  
  let url = phone ? `https://api.whatsapp.com/send?phone=${phone}&text=` + encodeURIComponent(text) : `https://wa.me/?text=` + encodeURIComponent(text);
  
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function exportToPDF() {
  const client = (quoteData.quote.client || '').trim();
  if (!client) {
    alert('Ingresa el nombre del cliente antes de guardar la cotización.');
    document.getElementById('clientName').focus();
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p', 'mm', 'a4');
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const margin = 20;
  let y = margin;

  // Header con logo
  if (quoteData.company.logo) {
    try {
      doc.addImage(quoteData.company.logo, 'PNG', margin, y, 30, 30);
    } catch (e) {
      // ignore image error
    }
  }
  doc.setFontSize(22);
  doc.setTextColor(44, 62, 80);
  doc.setFont('helvetica', 'bold');
  doc.text(quoteData.company.name, margin + 35, y + 12);

  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(100);
  doc.text(`RFC: ${quoteData.company.rfc}`, margin + 35, y + 20);
  doc.text(`Domicilio: ${quoteData.company.address.split('\n')[0]}`, margin + 35, y + 26);
  doc.text(quoteData.company.contact, margin + 35, y + 32);
  y += 42;

  // Meta info
  doc.setFontSize(10);
  doc.setTextColor(80);
  doc.setFont('helvetica', 'bold');
  doc.text('Fecha:', margin, y);
  doc.setFont('helvetica', 'normal');
  doc.text(quoteData.quote.date, margin + 25, y);
  doc.setFont('helvetica', 'bold');
  doc.text('Cliente:', margin + 100, y);
  doc.setFont('helvetica', 'normal');
  doc.text(quoteData.quote.client || 'Mostrador', margin + 125, y);
  y += 6;
  
  if (quoteData.quote.phone) {
    doc.setFont('helvetica', 'bold');
    doc.text('Teléfono:', margin + 100, y);
    doc.setFont('helvetica', 'normal');
    doc.text(quoteData.quote.phone, margin + 125, y);
    y += 6;
  }
  
  if (quoteData.quote.rfc) {
    doc.setFont('helvetica', 'bold');
    doc.text('RFC / Dir:', margin + 100, y);
    doc.setFont('helvetica', 'normal');
    doc.text(quoteData.quote.rfc, margin + 125, y);
    y += 6;
  }

  doc.setFont('helvetica', 'bold');
  doc.text('Folio:', margin + 100, y);
  doc.setFont('helvetica', 'normal');
  doc.text(quoteData.quote.number, margin + 125, y);
  doc.setFont('helvetica', 'bold');
  doc.text('Vigencia:', margin, y);
  doc.setFont('helvetica', 'normal');
  doc.text(quoteData.quote.validity || '15 días', margin + 25, y);
  y += 10;

  // Tabla de productos
  const tableData = quoteData.products.map((p, i) => {
    const qty = p.qty || 1;
    return [
      String(i + 1),
      p.name,
      fmt(p.price),
      String(qty),
      `${p.discount}%`,
      fmt(p.price * qty * (1 - p.discount / 100))
    ];
  });

  doc.autoTable({
    startY: y,
    head: [['#', 'Producto', 'Precio Unit.', 'Cant.', 'Desc.', 'Importe']],
    body: tableData,
    theme: 'striped',
    headStyles: { fillColor: [44, 62, 80], textColor: 255, fontSize: 9 },
    bodyStyles: { fontSize: 8 },
    columnStyles: {
      0: { cellWidth: 10, halign: 'center' },
      1: { cellWidth: 'auto' },
      2: { cellWidth: 26, halign: 'right' },
      3: { cellWidth: 14, halign: 'center' },
      4: { cellWidth: 16, halign: 'center' },
      5: { cellWidth: 28, halign: 'right' }
    },
    margin: { left: margin, right: margin }
  });

  y = doc.lastAutoTable.finalY + 5;

  // Totales
  const subtotal = quoteData.products.reduce((s, p) => s + p.price * (p.qty || 1) * (1 - p.discount / 100), 0);
  const totalDiscount = quoteData.products.reduce((s, p) => s + p.price * (p.qty || 1) * (p.discount / 100), 0);
  const ivaOn = document.getElementById('ivaToggle').checked;
  const iva = ivaOn ? subtotal * 0.16 : 0;

  doc.setFontSize(10);
  const rightX = pageWidth - margin;

  doc.setFont('helvetica', 'normal');
  doc.setTextColor(80);
  doc.text('Descuento:', rightX - 50, y, { align: 'right' });
  doc.setFont('helvetica', 'bold');
  doc.text(fmt(totalDiscount), rightX, y, { align: 'right' });
  y += 7;

  if (ivaOn) {
    doc.setFont('helvetica', 'normal');
    doc.text('IVA (16%):', rightX - 50, y, { align: 'right' });
    doc.setFont('helvetica', 'bold');
    doc.text(fmt(iva), rightX, y, { align: 'right' });
    y += 7;
  }

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(12);
  doc.setTextColor(211, 84, 0);
  doc.text('TOTAL:', rightX - 50, y, { align: 'right' });
  doc.text(fmt(subtotal + iva), rightX, y, { align: 'right' });

  // Footer
  doc.setFontSize(8);
  doc.setTextColor(150);
  doc.setFont('helvetica', 'italic');
  doc.text(`Generado el ${new Date().toLocaleDateString('es-MX')} — Siluet Perfect`, pageWidth / 2, pageHeight - 25, { align: 'center' });

  // Texto legal en rojo al pie
  doc.setFontSize(9);
  doc.setTextColor(211, 84, 0);
  doc.setFont('helvetica', 'bold');
  doc.text('Los precios pueden variar segun el tipo de cambio.', pageWidth / 2, pageHeight - 15, { align: 'center' });
  doc.text('EN CASO DE REQUERIR FACTURA SE SUMARA EL IVA.', pageWidth / 2, pageHeight - 8, { align: 'center' });

  doc.save(`cotizacion_${quoteData.quote.number}.pdf`);
}

  saveQuote();
